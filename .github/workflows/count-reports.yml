name: Count AI channel reports
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/count-reports.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: blocklist-update
          title: "Shared blocklist update"
          commit-message: "Update shared blocklist from community reports"
          body: |
            Channels that reached 3 independent reports from GitHub accounts older than 30 days.
            Review each one before merging. Merging publishes it to every Pro user within 12 hours.
          add-paths: site/blocklist.json
