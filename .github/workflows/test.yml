name: Test
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/*.test.mjs
      - name: Check blocklist.json is valid
        run: node -e "const d=require('./site/blocklist.json'); if(typeof d.version!=='number'||!Array.isArray(d.channels)) process.exit(1)"
